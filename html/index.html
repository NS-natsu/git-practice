<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Gitの練習</title>
    <link rel="icon" href="./icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/layout.css" type="text/css">
    <link rel="stylesheet" href="./css/icon.css" type="text/css">
    <link rel="stylesheet" href="./css/water.css" type="text/css">
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <header></header>
    <main>
      <div class="water">
        <div class="waterSurface"></div>
        <div class="underwater">
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
          <span class="bubble"></span>
        </div>
      </div>
      <template id="counter-template">
        <div class="counter" tabindex="0">
          <button class="reset" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#252525"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
          </button>      
          <label class="title">
            <input type="text" placeholder="counter" tabindex="-1"/>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-icon lucide-pencil"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
          </label>
          <button class="minus" type="button" tabindex="-1">-</button>
          <input class="display" type="number" value="0" tabindex="-1" readonly>
          <button class="plus" type="button" tabindex="-1">+</button>
        </div>
      </template>
    </main>
    <footer>Ⓒ 2026 SUZUKI YOKUTOKU</footer>
  </body>
</html>
